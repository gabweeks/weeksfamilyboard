<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weeks Family Board</title>

<style>
  body {
    margin: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .top {
    padding: 15px 0;
  }

  .profile {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid white;
    object-fit: cover;
    margin-bottom: 10px;
  }

  h1 { margin: 0; }

  canvas {
    background: #020617;
    border: 1px solid #334155;
    margin-top: 15px;
    touch-action: none;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    padding: 20px;
  }

  .item {
    background: #020617;
    border: 1px solid #334155;
  }

  button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: white;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="top">
  <img class="profile" src="https://instagram.fplu19-1.fna.fbcdn.net/v/t51.2885-19/346576795_1163680270967983_5337571337711107352_n.jpg">
  <h1>Marque sua presença na família Weeks :)</h1>
</div>

<canvas id="canvas" width="300" height="150"></canvas>
<br>
<button onclick="saveDrawing()">Salvar assinatura</button>

<div class="gallery" id="gallery"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
// 🔴 COLE SUA CONFIG DO FIREBASE AQUI
const firebaseConfig = {
  apiKey: "AIzaSyAMF2Bw5Moe4YbwgxDSmgL_YWY-DtSiTXE",
  authDomain: "weeksfamilyboard.firebaseapp.com",
  projectId: "weeksfamilyboard",
  storageBucket: "weeksfamilyboard.firebasestorage.app",
  messagingSenderId: "91920356874",
  appId: "1:91920356874:web:371f0f0bb3d948379ff1f3",
  measurementId: "G-93QYW4DJR7"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let drawing = false;

canvas.addEventListener("mousedown", () => drawing = true);
canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mousemove", draw);

canvas.addEventListener("touchstart", () => drawing = true);
canvas.addEventListener("touchend", () => drawing = false);
canvas.addEventListener("touchmove", draw);

function draw(e) {
  if (!drawing) return;

  const rect = canvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "white";

  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
}

function saveDrawing() {
  const dataURL = canvas.toDataURL();

  db.collection("signatures").add({ image: dataURL });

  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// CARREGAR EM TEMPO REAL
db.collection("signatures").onSnapshot(snapshot => {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  snapshot.forEach(doc => {
    const img = document.createElement("img");
    img.src = doc.data().image;
    img.className = "item";
    gallery.appendChild(img);
  });
});
</script>

</body>
</html>
